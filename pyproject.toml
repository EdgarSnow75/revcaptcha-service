[build-system]
requires = ["setuptools >= 64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revcaptcha"
version = "0.1.0"
dependencies = [
    "numpy",
    "soundfile",
    "soxr",
    "sounddevice",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "openai-whisper==20250625",
    "wespeaker @ git+https://github.com/wenet-e2e/wespeaker.git@c92349a14d6b426808c4e09b8b12e076864dfc11",
    "PyYAML==6.0.3",
    "onnxruntime==1.24.4",
    "s3prl==0.4.18",
    "transformers==5.5.0",
    "peft==0.18.1",
]
requires-python = ">= 3.11.9"
authors = [
    {name = "Edgar Snow", email = "edgarsnow572000@gmail.com"},
]
description = "A voice authentication system using the reverse voice captcha mechanism"
readme = "README.md"
keywords = ["speaker verification", "voice authentication", "lexical challenge-response", "short-utterance verification", "text-dependent authentication"]
classifiers = [
    "Development Status :: 1",
    "Programming Language :: Python"
]

[project.scripts]
revcaptcha = "revcaptcha.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "psutil"]

[tool.ruff]
line-length = 89
target-version = "py311"

[tool.pytest.ini_options]
markers = [ "slow: loads a real model (run with: pytest -m slow)"]
addopts = "-m 'not slow'"